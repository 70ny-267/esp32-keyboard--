<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AutoTyping 蓝牙键盘控制器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
      margin: 0;
      display: flex;
      justify-content: center;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: #1e293b;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    h2 {
      margin-top: 0;
      color: #38bdf8;
      text-align: center;
      font-size: 20px;
    }
    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 16px;
      font-weight: 600;
      text-align: center;
      width: 100%;
    }
    .disconnected { background: #475569; color: #cbd5e1; }
    .connected { background: #065f46; color: #34d399; }
    textarea {
      width: 100%;
      height: 140px;
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #fff;
      padding: 12px;
      font-size: 16px;
      outline: none;
      resize: vertical;
    }
    textarea:focus { border-color: #38bdf8; }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }
    button {
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button:active { transform: scale(0.98); }
    .btn-connect { background: #0284c7; color: white; width: 100%; margin-bottom: 12px; }
    .btn-send { background: #16a34a; color: white; grid-column: span 2; font-size: 17px; }
    .btn-pause { background: #eab308; color: #000; }
    .btn-resume { background: #0ea5e9; color: white; }
    .btn-stop { background: #dc2626; color: white; grid-column: span 2; }
    .log-box {
      margin-top: 16px;
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 10px;
      font-family: monospace;
      font-size: 13px;
      color: #94a3b8;
      height: 90px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>⌨️ AutoTyping 蓝牙控制器</h2>
    <div id="statusBadge" class="status-badge disconnected">蓝牙未连接</div>

    <button id="connectBtn" class="btn-connect" onclick="connectBle()">🔍 扫描并连接板子</button>

    <textarea id="textInput" placeholder="在此粘贴手机或电脑上复制的文本..."></textarea>

    <div class="btn-grid">
      <button class="btn-send" onclick="sendText()">🚀 发送并开始打字</button>
      <button class="btn-pause" onclick="sendCommand('pause')">⏸️ 暂停打字</button>
      <button class="btn-resume" onclick="sendCommand('resume')">▶️ 继续打字</button>
      <button class="btn-stop" onclick="sendCommand('stop')">⏹️ 紧急中止</button>
    </div>

    <div class="log-box" id="logBox">日志输出窗口就绪...</div>
  </div>

  <script>
    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const RX_CHAR_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
    const TX_CHAR_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

    let rxChar = null;
    let bleDevice = null;

    function log(msg) {
      const box = document.getElementById("logBox");
      box.innerHTML += "<div>" + msg + "</div>";
      box.scrollTop = box.scrollHeight;
    }

    async function connectBle() {
      try {
        log("正在请求扫描蓝牙设备...");
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: "AutoTyping-BLE" }],
          optionalServices: [SERVICE_UUID]
        });

        log("已找到设备，正在建立 GATT 连接...");
        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);

        rxChar = await service.getCharacteristic(RX_CHAR_UUID);
        const txChar = await service.getCharacteristic(TX_CHAR_UUID);

        // 监听来自板子的状态通知
        await txChar.startNotifications();
        txChar.addEventListener("characteristicvaluechanged", (e) => {
          const decoder = new TextDecoder("utf-8");
          const val = decoder.decode(e.target.value);
          log("板子反馈: " + val);
        });

        document.getElementById("statusBadge").className = "status-badge connected";
        document.getElementById("statusBadge").innerText = "已连接: AutoTyping-BLE";
        document.getElementById("connectBtn").innerText = "已连接成功";
        log("🎉 蓝牙连接成功！可直接输入内容。");
      } catch (err) {
        log("连接取消或失败: " + err);
      }
    }

    async function sendText() {
      const val = document.getElementById("textInput").value;
      if (!val) { alert("请先输入或粘贴文本！"); return; }
      if (!rxChar) { alert("请先点击上方连接蓝牙！"); return; }
      await writeBle(val);
      log("文本已下发，3 秒后开始在电脑上打字！");
    }

    async function sendCommand(cmd) {
      if (!rxChar) { alert("请先连接蓝牙！"); return; }
      await writeBle(cmd);
      log("已发送指令: " + cmd);
    }

    async function writeBle(str) {
      const encoder = new TextEncoder();
      const data = encoder.encode(str);
      // 分包下发 (兼容 20 字节标准 MTU)
      const chunkSize = 20;
      for (let i = 0; i < data.length; i += chunkSize) {
        const chunk = data.slice(i, i + chunkSize);
        await rxChar.writeValueWithoutResponse(chunk);
      }
    }
  </script>
</body>
</html>
